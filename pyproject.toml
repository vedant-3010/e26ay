[project]
name = "winddesk"
version = "1.0.0"
description = "Day-ahead wind forecast intelligence for a UK supplier's trading desk (pilot: January 2026 decisions)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "pandas",
  "numpy",
  "pyarrow",
  "httpx",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "pandas-stubs",
  "jupyter",
  "nbconvert",
  "matplotlib",
  "pre-commit",
  "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/winddesk"]

# ---------------------------------------------------------------- vercel (ARCHITECTURE §6.1)
[tool.vercel]
# Loads ./backend/winddesk/main.py as `backend.winddesk.main`; works because every import
# inside the package is relative.
entrypoint = "backend.winddesk.main:app"

# [tool.vercel.fastapi.static]: defaults kept on purpose. `app.frontend("/", "frontend/dist")`
# is promoted to the CDN, and the SPA (~0.5 MB) also stays in the function bundle so the
# function can serve the same files if a request reaches it. No middleware is used, so
# `cdn = true` is not needed.

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]
extend-exclude = ["frontend", "docs", "notebooks/.ipynb_checkpoints"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ", "PTH", "N"]
# DTZ: forbids naive datetimes, enforcing the "UTC, tz-aware" invariant (CLAUDE.md).
# En dash and minus sign are intentional: ranges ("16.5–39.5 h") and "D−1" in user-facing copy.
allowed-confusables = ["–", "−"]

[tool.ruff.lint.isort]
known-first-party = ["winddesk"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
packages = ["winddesk"]
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["winddesk.analytics.*", "winddesk.services.*", "winddesk.api.*", "winddesk.main", "winddesk.config"]
strict = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra --strict-markers"
markers = [
  "snapshot: contract tests against the committed real-data snapshot (run with `make test-contract`)",
]

[tool.coverage.run]
source = ["winddesk"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
